<!-- ============================================================
  CvSU GUIDE ADD-ON  (paste this whole block right BEFORE </body>)
  Adds: Campus Map (Google Maps) · smarter, interactive Cavi
  (guided apply steps, course quiz, map commands, follow-ups,
  compare, voice input) · saved programs · dark/light toggle.
  Your logo, photos and existing code stay untouched.
============================================================ -->
<style>
/* theme toggle (forces dark even when the device is in light mode) */
:root[data-theme="dark"]{--bg:#0e1710;--card:#16241a;--tx:#e8f1ea;--mut:#9db3a2;--bd:#25382a;--gold2:#3a3210}
:root[data-theme="dark"] h2,:root[data-theme="dark"] .card h3,:root[data-theme="dark"] .mapbar b{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mapbar b{color:var(--gold)}}
#tg{background:none;border:1px solid #ffffff55;color:#fff;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:1rem}
#tg:hover{border-color:var(--gold)}

/* campus map */
.btn.sm{padding:8px 16px;font-size:.88rem}
.btn.alt{background:var(--g);color:#fff}
.mapbox{margin-top:14px;border:2px solid var(--g);border-radius:14px;overflow:hidden;background:var(--card);aspect-ratio:16/9;min-height:260px;max-height:460px}
.mapbox iframe{width:100%;height:100%;border:0;display:block}
.mapbar{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.mapbar b{color:var(--g)}.mapbar span{color:var(--mut);font-size:.9rem;flex:1 1 220px}
#mchips .chip{cursor:pointer}

/* saved programs */
.pc{position:relative}
.pc .star{position:absolute;top:8px;right:10px;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--gold)}
.pc .star:focus-visible{outline:2px solid var(--g);border-radius:4px}
#favbar{display:none;margin:10px 0 0}
#favbar button{margin:6px 6px 0 0;border:1px solid var(--g);background:var(--card);color:var(--tx);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.82rem}

/* richer chat */
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts button{border:1px solid var(--g);background:var(--card);color:var(--tx);border-radius:999px;padding:4px 10px;font-size:.78rem;cursor:pointer}
.acts button:hover{background:var(--gold)}
.acts .fb{border:0;background:none;padding:2px 4px;font-size:.9rem;opacity:.75}
.pbar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:var(--g);transition:width .4s}
#bh button{background:none;border:0;font-size:18px;cursor:pointer;color:#fff;padding:0 2px}
#bf #mic{background:var(--card);color:var(--tx);padding:0 10px;font-size:1rem}
#bf #mic.rec{background:var(--gold);animation:pulse 1.2s infinite}
</style>

<script>
(function(){
/* ---------- helpers ---------- */
const B=$("#bm");
const enc=encodeURIComponent;
const SHORT=["Indang (Main)","Bacoor","Carmona","Cavite City","General Trias","Imus","Maragondon","Naic","Rosario (CCAT)","Silang","Tanza","Trece Martires","Dasmariñas LC"];
/* One Google Maps search per campus, same order as the CAMP list in your page */
const MAPQ=["Cavite State University Main Campus, Indang, Cavite","Cavite State University Bacoor Campus, Cavite","Cavite State University Carmona Campus, Cavite","Cavite State University Cavite City Campus","Cavite State University General Trias Campus, Cavite","Cavite State University Imus Campus, Cavite","Cavite State University Maragondon Campus, Cavite","Cavite State University Naic Campus, Cavite","Cavite State University CCAT Campus, Rosario, Cavite","Cavite State University Silang Campus, Cavite","Cavite State University Tanza Campus, Cavite","Cavite State University Trece Martires City Campus, Cavite","Cavite State University Dasmariñas Learning Center, Cavite"];
const ALLQ="Cavite State University campuses, Cavite, Philippines";
const AREAKEY=["AFE","ENG","ED","EMDS","NUR","VET","AS","SPE"]; /* lines up with AREA in your page */

/* ---------- 1. theme toggle ---------- */
const tb=document.createElement("button");tb.id="tg";tb.type="button";tb.setAttribute("aria-label","Toggle dark mode");
function setTheme(t){document.documentElement.dataset.theme=t;tb.textContent=t=="dark"?"☀️":"🌙";try{localStorage.setItem("cvsu_theme",t)}catch(e){}}
let th;try{th=localStorage.getItem("cvsu_theme")}catch(e){}
setTheme(th||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
tb.onclick=()=>setTheme(document.documentElement.dataset.theme=="dark"?"light":"dark");
$("nav").appendChild(tb);

/* ---------- 2. campus map section ---------- */
const sec=document.createElement("section");sec.id="map";
sec.innerHTML=`<h2>Campus Map</h2>
<p style="color:var(--mut)">Pick a campus to see it on Google Maps, then open it for directions from where you are.</p>
<div class="chips" id="mchips"></div>
<div class="mapbox"><iframe id="mframe" title="CvSU campus map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
<div class="mapbar"><b id="mname"></b><span id="mdesc"></span>
<a class="btn sm" id="mopen" target="_blank" rel="noopener">📍 Open in Google Maps</a>
<a class="btn sm alt" id="mdir" target="_blank" rel="noopener">🧭 Directions</a></div>
<div class="note">ℹ️ Each pin is a Google Maps search by campus name. If the map does not appear here (some preview pages block embeds), use “Open in Google Maps”, and double-check the exact gate on the map before you travel.</div>`;
$("#campuses").after(sec);
$('nav a[href="#campuses"]').insertAdjacentHTML("afterend",'<a href="#map">Map</a>');
$("#mchips").innerHTML=`<button class="chip on" data-m="-1">🗺️ All campuses</button>`+SHORT.map((s,i)=>`<button class="chip" data-m="${i}">📍 ${s}</button>`).join("");
let curMap=-1;
function selectCampus(i,scroll){
  curMap=i;const q=i<0?ALLQ:MAPQ[i];
  document.querySelectorAll("#mchips .chip").forEach(c=>c.classList.toggle("on",+c.dataset.m===i));
  $("#mframe").src="https://www.google.com/maps?q="+enc(q)+"&output=embed";
  $("#mname").textContent=i<0?"All CvSU campuses":CAMP[i][0];
  $("#mdesc").textContent=i<0?"Showing campuses across Cavite. Tap a campus above to zoom in.":CAMP[i][1];
  $("#mopen").href="https://www.google.com/maps/search/?api=1&query="+enc(q);
  $("#mdir").href="https://www.google.com/maps/dir/?api=1&destination="+enc(q);
  if(scroll)$("#map").scrollIntoView({behavior:"smooth"});
}
$("#mchips").onclick=e=>{const b=e.target.closest("button");if(b)selectCampus(+b.dataset.m,false)};
selectCampus(-1,false);
/* tapping a campus chip in "Campuses in Cavite" also moves the map + adds a link */
$("#camp").addEventListener("click",e=>{
  const i=e.target.dataset.i;if(i==null)return;selectCampus(+i,false);
  const n=$("#campnote");n.append(" ");const a=document.createElement("a");a.href="#map";a.textContent="📍 See it on the map";
  a.onclick=ev=>{ev.preventDefault();selectCampus(+i,true)};n.appendChild(a);
});

/* ---------- 3. saved programs (stars) ---------- */
let FAV=[];try{FAV=JSON.parse(localStorage.getItem("cvsu_fav")||"[]")}catch(e){}
const saveFav=()=>{try{localStorage.setItem("cvsu_fav",JSON.stringify(FAV))}catch(e){}};
function toggleFav(n){const had=FAV.includes(n);FAV=had?FAV.filter(x=>x!=n):[...FAV,n];saveFav();favBar();return !had}
const fb=document.createElement("div");fb.id="favbar";fb.className="note";$("#pcount").after(fb);
function favBar(){
  if(!FAV.length){fb.style.display="none";return}
  fb.style.display="block";
  fb.innerHTML="⭐ <b>My saved programs ("+FAV.length+"):</b> "+FAV.join(", ")+"<br><button id='fq'>💬 Ask Cavi to compare</button><button id='fc'>Clear list</button>";
  $("#fq").onclick=()=>{if(!$("#bot").classList.contains("open"))openBot();ask(FAV.length>1?"Compare "+FAV[0]+" and "+FAV[1]:"Show my saved programs")};
  $("#fc").onclick=()=>{FAV=[];saveFav();favBar();pdraw()};
}
const _pd=pdraw;
pdraw=function(){_pd();document.querySelectorAll("#pg .pc").forEach((c,i)=>{const p=PR[i];if(!p)return;const s=document.createElement("button");s.className="star";s.type="button";s.dataset.p=p[1];s.textContent=FAV.includes(p[1])?"★":"☆";s.title="Save to my list";s.setAttribute("aria-label","Save "+p[1]);c.appendChild(s)});favBar()};
$("#pg").addEventListener("click",e=>{const s=e.target.closest(".star");if(!s)return;e.stopPropagation();s.textContent=toggleFav(s.dataset.p)?"★":"☆"},true);
pdraw();

function browse(key,name){
  pf=key||"All";pq=name?name.toLowerCase():"";$("#pq").value=name||"";
  document.querySelectorAll("#pfl .tab").forEach(t=>t.classList.toggle("on",t.dataset.k==pf));
  pdraw();$("#explore").scrollIntoView({behavior:"smooth"});
}

/* ---------- 4. smarter, interactive Cavi ---------- */
let lastP=null,lastC=null,flow=null,acts=null,picks=[];
const ci=L=>CK2.findIndex(x=>new RegExp(x[0]).test(L));
const info=p=>p[1]+" · "+SH[p[0]]+(ROS.has(p[1])?" · also at Rosario (CCAT)":"")+(HD.has(p[1])?" · listed full in SY 2020–2021 🔥":" · not on the SY 2020–2021 full list");

/* guided application */
const AP=[
["Apply online","Main Campus applicants apply through the CvSU admission portal (admission.cvsu.edu.ph). Some satellite campuses, like Imus and Rosario (CCAT), have run their own admission pages, so check yours."],
["Submit your requirements","Graduates: application form, Grade 12 report card and a certificate of good moral character. Current Grade 12 students: application form, Grade 11 report card and proof of Grade 12 enrollment. Add a 1×1 ID photo."],
["Take the admission exam","Once your requirements are complete, the Office of Student Affairs and Services (OSAS) schedules your exam."],
["Get your result and NOSA","Your exam result comes with your Notice of Student Admission (NOSA)."],
["Do the medical exam","Complete it at the campus clinic."],
["Enroll","Enroll at the Registrar’s Office. That’s the last step. 🎉"]];
function apStep(){
  const s=AP[flow.i],last=flow.i==AP.length-1;
  pending=last?["Start over","Done"]:(flow.i?["Next step ▶","Back","Stop guide"]:["Next step ▶","Stop guide"]);
  acts=[["✅ Open my checklist",()=>$("#tools").scrollIntoView({behavior:"smooth"})]];
  return "Step "+(flow.i+1)+" of "+AP.length+": "+s[0]+". "+s[1];
}

/* course quiz */
function qzAsk(){
  const rest=INT.map((x,i)=>[i,x]).filter(a=>!picks.includes(a[0]));
  pending=rest.map(a=>a[1][0]+" "+a[1][1]);if(picks.length)pending.push("Show my results");
  return picks.length?"Got it. Anything else you enjoy? Pick another, or tap “Show my results”.":"Quick quiz: pick up to 3 things you enjoy most. What’s first?";
}
function qzResult(){
  const r=AREA.map((a,i)=>[i,a[1].filter(x=>picks.includes(x)).length]).filter(a=>a[1]).sort((a,b)=>b[1]-a[1]).slice(0,2);
  flow=null;
  if(!r.length){pending=QA;return"I need at least one interest to match you. Say “help me choose a course” to try again."}
  acts=r.map(a=>["🔎 Browse "+SH[AREAKEY[a[0]]],()=>browse(AREAKEY[a[0]])]);acts.push(["🔁 Retake quiz",()=>ask("Help me choose a course")]);
  pending=["How do I apply?","Which programs fill up fastest?"];
  return "Based on your picks, look at:\n"+r.map(a=>"🎓 "+AREA[a[0]][0]+" (e.g. "+PROG.filter(p=>p[0]==AREAKEY[a[0]]).slice(0,3).map(p=>p[1]).join(", ")+")").join("\n")+"\nTap a button to browse the programs, and ⭐ the ones you like.";
}

const _l=local;
local=function(m){
  const L=m.toLowerCase();acts=null;
  /* active flows */
  if(flow&&flow.t=="ap"){
    if(/\b(stop|cancel|exit|quit|done)\b/.test(L)){flow=null;pending=QA;return"Guide closed. Ask me anything else, or say “guide me” to restart."}
    if(/start over|restart/.test(L)){flow.i=0;return apStep()}
    if(/\b(back|previous)\b/.test(L)){flow.i=Math.max(0,flow.i-1);return apStep()}
    if(/next|continue|\bok\b|okay|\byes\b|▶/.test(L)){flow.i=Math.min(AP.length-1,flow.i+1);return apStep()}
  }
  if(flow&&flow.t=="qz"){
    if(/\b(stop|cancel|exit|quit)\b/.test(L)){flow=null;pending=QA;return"Quiz closed. Ask me anything else!"}
    if(/result|done|finish|show/.test(L)&&picks.length)return qzResult();
    const k=INT.findIndex((x,i)=>!picks.includes(i)&&(L.includes(x[1].toLowerCase())||L.includes(x[1].toLowerCase().split(" ")[0])));
    if(k>-1){picks.push(k);return picks.length>=3?qzResult():qzAsk()}
    return qzAsk()
  }
  /* help + guided starts */
  if(/\b(help|what can you do|menu|options)\b/.test(L)&&!/choose|pick|decide|course|program/.test(L)){pending=["Guide me step by step","Help me choose a course","Show campus map","My saved programs"];return"I can walk you through applying step by step, help you pick a program area, put any campus on the map, answer follow-up questions (try “is it competitive?”), compare two programs and keep a list of programs you save. What would you like?"}
  if(/guide me|walk me through|step.?by.?step|apply.*(guide|steps)/.test(L)){flow={t:"ap",i:0};return"Let’s do it together. Tap “Next step ▶” whenever you’re ready.\n\n"+apStep()}
  if(/quiz|help me (choose|pick|decide)|(which|what) (course|program).*(fit|for me|choose|pick|take)|recommend (a |me )?(course|program)|what should i take/.test(L)){flow={t:"qz"};picks=[];return qzAsk()}
  /* map */
  if(/\b(map|where is|where’s|where's|located|location|directions?|how (do i|to) get|pin|navigate|near me)\b/.test(L)){
    let c=ci(L);if(c<0&&lastC!=null&&/\b(it|there|that)\b/.test(L))c=lastC;
    petSay("Pin dropped! 📍");
    if(c<0){selectCampus(-1,true);pending=["Indang","Imus","Rosario","Silang","Trece Martires","Bacoor"];return"Here’s the overview of all campuses. Tell me one and I’ll zoom in:"}
    lastC=c;selectCampus(c,true);
    acts=[["📍 Open in Google Maps",()=>window.open($("#mopen").href,"_blank")],["🧭 Directions",()=>window.open($("#mdir").href,"_blank")]];
    pending=["How do I apply?","What courses does CvSU offer?"];
    return CAMP[c][0]+": "+CAMP[c][1]+" I put it on the map below."
  }
  /* saved list */
  if(/\b(my (list|saved|programs?|favou?rites?)|saved programs|shortlist)\b/.test(L)){
    if(!FAV.length){pending=["Help me choose a course"];return"Your list is empty. Tap the ☆ on any program card in the Course Explorer, or say “save” after asking about a program."}
    acts=[["🔎 View in Explorer",()=>$("#explore").scrollIntoView({behavior:"smooth"})]];
    if(FAV.length>1)pending=["Compare "+FAV[0]+" and "+FAV[1]];
    return"Your saved programs:\n"+FAV.map(n=>{const p=PROG.find(x=>x[1]==n);return"⭐ "+(p?info(p):n)}).join("\n")
  }
  if(/\bclear (my )?(list|saved)/.test(L)){FAV=[];saveFav();favBar();pdraw();return"Done, your saved list is clear."}
  if(/\b(save|bookmark|shortlist)\b/.test(L)){
    const r=fp(L);const p=r.length==1?r[0]:(/\b(it|this|that)\b/.test(L)?lastP:null);
    if(!p){pending=QA;return"Which program should I save? Name it, like “save BS Nursing”."}
    if(!FAV.includes(p[1]))toggleFav(p[1]);pdraw();lastP=p;pending=["My saved programs"];return"⭐ Saved "+p[1]+" to your list ("+FAV.length+" saved)."
  }
  /* compare */
  if(/\b(compare|versus|vs\.?|difference between)\b/.test(L)){
    const parts=L.replace(/^.*?(compare|difference between)/,"").split(/\band\b|\bvs\.?\b|\bversus\b|,/).map(s=>s.trim()).filter(Boolean);
    const ps=parts.map(s=>{const r=fp(s);return r.length?r[0]:null}).filter(Boolean);
    if(ps.length>=2&&ps[0]!=ps[1]){lastP=ps[1];return"Side by side:\n🅰️ "+info(ps[0])+"\n🅱️ "+info(ps[1])+"\nTip: 🔥 programs fill up, so keep a backup choice."}
    pending=["Compare BS Nursing and BS Midwifery"];return"Tell me two programs, like “compare BS Nursing and BS Midwifery”."
  }
  /* follow-ups about the last program */
  if(lastP&&/\b(it|that|this|there)\b/.test(L)&&!fp(L).length){
    if(/slot|compet|hard|full|chance|popular/.test(L)){pending=["Save it","Which programs fill up fastest?"];return lastP[1]+(HD.has(lastP[1])?" was listed as full for new students in SY 2020–2021, so it’s competitive. Apply early and keep a backup program.":" was not on the SY 2020–2021 full list, but slots are still limited. Apply early.")}
    if(/campus|where|offered|rosario/.test(L)){return lastP[1]+(ROS.has(lastP[1])?" is offered at Rosario (CCAT), and the Main Campus in Indang has the widest range of programs.":" is on the official list, but I only have confirmed campus info for Rosario (CCAT), where it’s not listed. Ask the campus admission office where it’s offered.")}
    if(/college|under|department/.test(L))return lastP[1]+" falls under the "+COL[lastP[0]]+"."
  }
  /* small talk */
  if(/who are you|your name|are you (a )?(bot|ai|real)/.test(L)){pending=QA;return"I’m Cavi, the CvSU Guide’s helper owl. I answer from this page’s information, so for anything official please confirm at cvsu.edu.ph."}
  if(/\b(dance|party)\b/.test(L)){pet.classList.add("dance");setTimeout(()=>pet.classList.remove("dance"),1100);return"💃🎉 Go Green and Gold!"}
  if(/\b(bye|goodbye|see you)\b/.test(L))return"Bye! Good luck with your CvSU journey! 💚";

  /* fall back to your existing answer engine, then enrich it */
  const out=_l(m);
  const c=ci(L);
  if(c>=0){lastC=c;acts=(acts||[]).concat([["📍 Show "+SHORT[c]+" on map",()=>{selectCampus(c,true);petSay("Pin dropped! 📍")}]])}
  const r=fp(L);
  if(r.length==1){
    const p=r[0];lastP=p;
    acts=(acts||[]).concat([[FAV.includes(p[1])?"★ Saved":"☆ Save",b=>{const on=toggleFav(p[1]);pdraw();return on?"★ Saved":"☆ Save"}],["🔎 Show in Explorer",()=>browse("All",p[1])]]);
  }
  if(/\bapply|application\b/.test(L)&&!acts)acts=[["🧭 Guide me step by step",()=>ask("Guide me step by step")]];
  return out;
};

/* buttons + 👍/👎 under bot messages */
function addActs(m,a,thumbs){
  const d=document.createElement("div");d.className="acts";
  a.forEach(x=>{const b=document.createElement("button");b.type="button";b.textContent=x[0];b.onclick=()=>{const t=x[1](b);if(typeof t=="string")b.textContent=t};d.appendChild(b)});
  if(thumbs){["👍","👎"].forEach((e,k)=>{const b=document.createElement("button");b.type="button";b.className="fb";b.textContent=e;b.setAttribute("aria-label",k?"Not helpful":"Helpful");
    b.onclick=()=>{d.querySelectorAll(".fb").forEach(x=>x.remove());const s=document.createElement("span");s.style.fontSize=".78rem";s.textContent=k?"Sorry! Try rephrasing, or check cvsu.edu.ph.":"Glad it helped! 💚";d.appendChild(s)};d.appendChild(b)})}
  if(d.children.length)m.appendChild(d);
}
const _s3=say;
say=function(t,w){
  _s3(t,w);
  if(w!="b")return;
  const m=B.lastElementChild;if(!m||!m.classList.contains("b"))return;
  m.style.whiteSpace="pre-line";
  const a=acts;acts=null;
  if(flow&&flow.t=="ap"){const bar=document.createElement("div");bar.className="pbar";bar.innerHTML="<i style='width:"+Math.round((flow.i+1)/AP.length*100)+"%'></i>";m.appendChild(bar)}
  addActs(m,a||[],t.length>70&&!flow&&!/^Guide closed|^Sorry|^Hi|^Chat cleared|^Bye|^Quiz closed/.test(t));
  B.scrollTop=B.scrollHeight;
};

/* chat header: clear button + voice input */
const clr=document.createElement("button");clr.type="button";clr.id="clr";clr.textContent="🧹";clr.title="Clear chat";clr.setAttribute("aria-label","Clear chat");
$("#spk").after(clr);
clr.onclick=()=>{B.innerHTML="";flow=null;acts=null;lastP=null;lastC=null;pending=QA;say("Chat cleared. What would you like to know?","b")};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  const mb=document.createElement("button");mb.type="button";mb.id="mic";mb.textContent="🎤";mb.title="Speak your question";mb.setAttribute("aria-label","Speak your question");
  $("#bf").insertBefore(mb,$("#bf button"));
  mb.onclick=()=>{try{const r=new SR();r.lang="en-PH";r.interimResults=false;mb.classList.add("rec");
    r.onresult=e=>{const t=e.results[0][0].transcript;if(t)ask(t)};r.onend=r.onerror=()=>mb.classList.remove("rec");r.start()}catch(e){mb.classList.remove("rec")}};
}

/* richer first-open shortcuts */
const _ob2=openBot;let firstOpen=true;
openBot=function(){_ob2();if(firstOpen&&$("#bot").classList.contains("open")){firstOpen=false;showQ(["Guide me step by step","Help me choose a course","Show campus map","Slots","Free tuition","My saved programs"])}};

/* Cavi mentions the new stuff */
IDLE.push("Find your campus on the map 📍","Try: “Help me choose a course” 🧭","Tap ☆ on a program, then ask me to compare! ⭐","Say “guide me” and I’ll walk you through applying 📝");
})();
</script>
